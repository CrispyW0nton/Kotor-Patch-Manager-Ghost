# Issue #98 K1 prototype hooks.
#
# CSWCAnimBase::SetAnimation entry.
#
# Development patches can remap animation IDs before the engine forwards them
# to the concrete animation implementation. This is useful for targeted test
# triggers, but the current smoke test leaves vanilla idle/locomotion IDs alone
# after live testing showed those paths are not safe proof points.
[[hooks]]
address = 0x0069d4f0
type = "detour"
function = "OverrideSetAnimationId"
original_bytes = [0x8b, 0x54, 0x24, 0x10, 0x8b, 0x01]

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # CSWCAnimBase::SetAnimation animation-id stack slot.

# CSWCAnimBaseHeadWield::SetAnimation entry.
#
# Player and humanoid creature bodies commonly dispatch through the concrete
# head/wield animation implementation instead of the CSWCAnimBase wrapper
# above. Hooking this entry gives the smoke test telemetry on the live body
# path and lets a targeted registry override rewrite the ID before either
# underlying SetAnimationInternal call consumes it.
[[hooks]]
address = 0x006993b0
type = "detour"
function = "OverrideSetAnimationId"
original_bytes = [0x53, 0x8b, 0x5c, 0x24, 0x10]

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # CSWCAnimBaseHeadWield::SetAnimation animation-id stack slot.

# CSWCAnimBaseWield::SetAnimationInternal entry.
#
# HeadWield forwards into this path for wielded sub-objects. The animation ID
# is the second explicit thiscall parameter, so it lives at stack +8.
[[hooks]]
address = 0x0069a3e0
type = "detour"
function = "OverrideSetAnimationInternalId"
original_bytes = [0x6a, 0xff, 0x64, 0xa1, 0x00, 0x00, 0x00, 0x00]

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # CSWCAnimBaseWield::SetAnimationInternal animation-id stack slot.

# CSWCAnimBaseTW::SetAnimationInternal entry.
#
# This is the body/torso path that ultimately falls back to
# CSWCAnimBase::SetAnimationInternal. It is the key visual gate for PMBAM.
[[hooks]]
address = 0x0069c940
type = "detour"
function = "OverrideSetAnimationInternalId"
original_bytes = [0x64, 0xa1, 0x00, 0x00, 0x00, 0x00]

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # CSWCAnimBaseTW::SetAnimationInternal animation-id stack slot.

# CSWCAnimBase::AnimationExists entry.
#
# Ghidra shows this function takes an animation ID, resolves it through
# GetAnimationName, then asks the target animation object whether that resolved
# name has a positive duration. This entry hook records the raw ID before the
# vanilla name resolution runs.
[[hooks]]
address = 0x0069d910
type = "detour"
function = "LogAnimationExistsRequest"
original_bytes = [0x6a, 0xff, 0x68, 0x70, 0x0c, 0x73, 0x00]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # CSWCAnimBase* this pointer.

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # Animation-id stack slot.

# CSWCAnimBase::AnimationExists target lookup.
#
# At this point EAX is CExoString::CStr(resolved_name) and ECX is the target
# animation object at [this+0xb8]. Logging here confirms whether kpmwin1 reaches
# the engine's existence query before the virtual length check runs.
[[hooks]]
address = 0x0069d9b5
type = "detour"
function = "LogAnimationExistsLookup"
original_bytes = [0x50, 0xff, 0x57, 0x1c, 0xd9, 0x44, 0x24, 0x08]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # Target animation object.

[[hooks.parameters]]
source = "eax"
type = "pointer" # Resolved animation name C string.

# CSWCAnimBase::AnimationExists success and failure result assignments.
[[hooks]]
address = 0x0069d9cb
type = "detour"
function = "LogAnimationExistsResultTrue"
original_bytes = [0xbe, 0x01, 0x00, 0x00, 0x00]

# Disabled: 0x0069d9d2 is immediately before the shared continuation at
# 0x0069d9d4. A five-byte detour here overlaps that continuation and can crash
# the success path. Keep false-result inference from the absence of TRUE logs.

# Gob::PlayAnimation entry.
#
# Temporary runtime telemetry for Issue #98. The engine ultimately plays by
# name, so this hook confirms which string reaches the model/supermodel lookup
# after GetAnimationName and the CSWCAnimBase dispatch layers finish.
[[hooks]]
address = 0x00485bd0
type = "detour"
function = "LogPlayAnimationRequest"
original_bytes = [0x81, 0xec, 0x48, 0x01, 0x00, 0x00]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # Address of the stack slot containing char* animation name.

# Gob::PlayAnimation after EBX receives the raw animation-name pointer.
#
# The entry hook above can log the requested stack name, but KPM passes a copy
# of stack parameters to C detours, so mutating that pointer does not affect the
# original function. This non-returning hook patches the saved EBX register in
# the wrapper state, restores CPU state, then replays the stolen PUSH/PUSH bytes
# and jumps to the original strcmp call at 0x00485bfc.
[[hooks]]
address = 0x00485bf6
type = "detour"
function = "OverridePlayAnimationNameRegister"
original_bytes = [0x53, 0x68, 0x04, 0xee, 0x73, 0x00]
exclude_from_restore = ["ebx"]
skip_original_bytes = true

[[hooks.parameters]]
source = "ebx"
type = "pointer" # Raw animation-name C string.

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

# AnimRun::AnimRun(Animation*) constructor.
#
# Gob::PlayAnimation calls this constructor only after it has found an
# Animation descriptor by name. If kpmwin1 appears here with a non-zero
# duration, lookup and run construction have both passed.
[[hooks]]
address = 0x00481890
type = "detour"
function = "LogAnimRunConstruct"
original_bytes = [0x8b, 0xc1, 0x8b, 0x4c, 0x24, 0x04]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # AnimRun* being initialized.

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # Stack slot containing Animation*.

# Gob::PlayAnimation result from the add-in/supermodel search at [Gob+0x64].
[[hooks]]
address = 0x00485d58
type = "detour"
function = "LogGobFindAnimationAddInResult"
original_bytes = [0x8b, 0xe8, 0x8b, 0x46, 0x64]

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "ebx"
type = "pointer" # char* animation name query.

[[hooks.parameters]]
source = "eax"
type = "pointer" # Animation* result from FindAnimation.

# Gob::PlayAnimation result from the local model search at [Gob+0x58].
[[hooks]]
address = 0x00485d72
type = "detour"
function = "LogGobFindAnimationLocalResult"
original_bytes = [0x8b, 0x56, 0x58, 0x83, 0xc4, 0x08]

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "ebx"
type = "pointer" # char* animation name query.

[[hooks.parameters]]
source = "eax"
type = "pointer" # Animation* result from FindAnimation.

# CSWCAnimBase::SetAnimationInternal call into the target object's
# PlayAnimation virtual. EAX has CExoString::CStr(localName), EBX has target.
[[hooks]]
address = 0x0069e9a1
type = "detour"
function = "LogBaseAnimationPlayCall"
original_bytes = [0x8b, 0xcb, 0x50, 0xff, 0x56, 0x18]

[[hooks.parameters]]
source = "ebx"
type = "pointer" # CAurObject/Gob target.

[[hooks.parameters]]
source = "eax"
type = "pointer" # char* animation name.

# CSWCAnimBaseTW::SetAnimationInternal primary body-subobject PlayAnimation.
[[hooks]]
address = 0x0069c9d2
type = "detour"
function = "LogTWPrimaryAnimationPlayCall"
original_bytes = [0x50, 0xff, 0x55, 0x18, 0x85, 0xc0]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # CAurObject/Gob target.

[[hooks.parameters]]
source = "eax"
type = "pointer" # char* animation name.

# CSWCAnimBaseTW::SetAnimationInternal secondary body-subobject PlayAnimation.
[[hooks]]
address = 0x0069ca13
type = "detour"
function = "LogTWSecondaryAnimationPlayCall"
original_bytes = [0x50, 0xff, 0x55, 0x18, 0x85, 0xc0]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # CAurObject/Gob target.

[[hooks.parameters]]
source = "eax"
type = "pointer" # char* animation name.

# These first hooks target the shared fallback epilogues in the client-side
# attack animation ID resolvers. They let vanilla compute an animation ID, then
# allow CustomAnimationCore to swap ESI and emulate the original function
# epilogue. They are intentionally non-returning because the stolen bytes
# include RET instructions that must execute against Update*AttackData's stack
# frame, not inside KPM's generated wrapper.

# CSWCCreature::UpdateMeleeAttackData fallback/default epilogue.
[[hooks]]
address = 0x0061406c
type = "detour"
function = "OverrideMeleeDefaultAnimationId"
original_bytes = [0x5f, 0x8b, 0xc6, 0x5e, 0x5b, 0xc2, 0x10, 0x00]
exclude_from_restore = ["esi"]
skip_original_bytes = true

[[hooks.parameters]]
source = "esi"
type = "uint" # Vanilla animation id.

[[hooks.parameters]]
source = "esp+16"
type = "pointer" # UpdateMeleeAttackData param_1.

[[hooks.parameters]]
source = "esp+28"
type = "pointer" # UpdateMeleeAttackData param_4.

# CSWCCreature::UpdateRangedAttackData fallback/default epilogue.
[[hooks]]
address = 0x0061428c
type = "detour"
function = "OverrideRangedDefaultAnimationId"
original_bytes = [0x8b, 0xc6, 0x5e, 0xc2, 0x08, 0x00]
exclude_from_restore = ["esi"]
skip_original_bytes = true

[[hooks.parameters]]
source = "esi"
type = "uint" # Vanilla animation id.

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # UpdateRangedAttackData param_1.

[[hooks.parameters]]
source = "esp+12"
type = "pointer" # UpdateRangedAttackData param_2.

# CSWCAnimBase::GetAnimationName post-animations.2da lookup branch.
#
# This detour is intentionally non-returning. The stolen bytes include a short
# conditional jump, so replaying them from the generated wrapper would retarget
# the branch into wrapper memory. OverrideAnimationNameLookup restores the
# wrapper-saved CPU state itself, then jumps to either:
# - 0x0069e6a2: vanilla success path, after output CExoString is populated
# - 0x0069e699: vanilla failure assignment path, after recreating the stolen PUSH
[[hooks]]
address = 0x0069e690
type = "detour"
function = "OverrideAnimationNameLookup"
original_bytes = [0x85, 0xc0, 0x75, 0x0e, 0x68, 0x1c, 0xd7, 0x73, 0x00]
skip_original_bytes = true
