# Issue #98 K1 direct-name prototype hooks.
#
# This reduced hook set is intentionally narrow. The current proof-of-life test
# is only: can a model-local animation named by a patch be found by
# Gob::PlayAnimation and used to construct an AnimRun? The animation-ID,
# GetAnimationName, AnimationExists, and combat fallback hooks are left out of
# this runtime build until the direct name path is stable.

target_versions = [
    "9C10E0450A6EECA417E036E3CDE7474FED1F0A92AAB018446D156944DEA91435",
    "34E6D971C034222A417995D8E1E8FDD9F8781795C9C289BD86C499A439F34C88",
    "304A212F759F19FFD81D4B3C2F8B95FD73FBCB0BCA9E07C1D898D9FF05F9B775",
    "761F9466F456A83909036BAEBB5C43167D722387BE66E54617BA20A8C49E9886",
]

# Gob::PlayAnimation entry.
#
# Runtime telemetry for the raw animation name and owning local model before
# any name rewrite happens.
[[hooks]]
address = 0x00485bd0
type = "detour"
function = "LogPlayAnimationRequest"
original_bytes = [0x81, 0xec, 0x48, 0x01, 0x00, 0x00]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # Address of the stack slot containing char* animation name.

# Gob::PlayAnimation after EBX receives the raw animation-name pointer.
#
# The entry hook above can log the requested stack name, but KPM passes a copy
# of stack parameters to C detours, so mutating that pointer does not affect the
# original function. This non-returning hook patches the saved EBX register in
# the wrapper state, restores CPU state, then replays the stolen PUSH/PUSH bytes
# and jumps to the original strcmp call at 0x00485bfc.
[[hooks]]
address = 0x00485bf6
type = "detour"
function = "OverridePlayAnimationNameRegister"
original_bytes = [0x53, 0x68, 0x04, 0xee, 0x73, 0x00]
exclude_from_restore = ["ebx"]
skip_original_bytes = true

[[hooks.parameters]]
source = "ebx"
type = "pointer" # Raw animation-name C string.

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

# AnimRun::AnimRun(Animation*) constructor.
#
# Gob::PlayAnimation calls this constructor only after it has found an
# Animation descriptor by name. If kpmwin1 appears here with a non-zero
# duration, lookup and run construction have both passed.
[[hooks]]
address = 0x00481890
type = "detour"
function = "LogAnimRunConstruct"
original_bytes = [0x8b, 0xc1, 0x8b, 0x4c, 0x24, 0x04]

[[hooks.parameters]]
source = "ecx"
type = "pointer" # AnimRun* being initialized.

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # Stack slot containing Animation*.

# Gob::PlayAnimation result from the add-in/supermodel search at [Gob+0x64].
[[hooks]]
address = 0x00485d58
type = "detour"
function = "LogGobFindAnimationAddInResult"
original_bytes = [0x8b, 0xe8, 0x8b, 0x46, 0x64]

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "ebx"
type = "pointer" # char* animation name query.

[[hooks.parameters]]
source = "eax"
type = "pointer" # Animation* result from FindAnimation.

# Gob::PlayAnimation result from the local model search at [Gob+0x58].
[[hooks]]
address = 0x00485d72
type = "detour"
function = "LogGobFindAnimationLocalResult"
original_bytes = [0x8b, 0x56, 0x58, 0x83, 0xc4, 0x08]

[[hooks.parameters]]
source = "esi"
type = "pointer" # Gob* this pointer.

[[hooks.parameters]]
source = "ebx"
type = "pointer" # char* animation name query.

[[hooks.parameters]]
source = "eax"
type = "pointer" # Animation* result from FindAnimation.
