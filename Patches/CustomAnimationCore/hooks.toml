# Issue #98 K1 prototype hooks.
#
# CSWCAnimBase::SetAnimation entry.
#
# Development patches can remap animation IDs before the engine forwards them
# to the concrete animation implementation. This is useful for targeted test
# triggers, but the current smoke test leaves vanilla idle/locomotion IDs alone
# after live testing showed those paths are not safe proof points.
[[hooks]]
address = 0x0069d4f0
type = "detour"
function = "OverrideSetAnimationId"
original_bytes = [0x8b, 0x54, 0x24, 0x10, 0x8b, 0x01]

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # CSWCAnimBase::SetAnimation animation-id stack slot.

# CSWCAnimBaseHeadWield::SetAnimation entry.
#
# Player and humanoid creature bodies commonly dispatch through the concrete
# head/wield animation implementation instead of the CSWCAnimBase wrapper
# above. Hooking this entry gives the smoke test telemetry on the live body
# path and lets a targeted registry override rewrite the ID before either
# underlying SetAnimationInternal call consumes it.
[[hooks]]
address = 0x006993b0
type = "detour"
function = "OverrideSetAnimationId"
original_bytes = [0x53, 0x8b, 0x5c, 0x24, 0x10]

[[hooks.parameters]]
source = "esp+4"
type = "pointer" # CSWCAnimBaseHeadWield::SetAnimation animation-id stack slot.

# CSWCAnimBaseWield::SetAnimationInternal entry.
#
# HeadWield forwards into this path for wielded sub-objects. The animation ID
# is the second explicit thiscall parameter, so it lives at stack +8.
[[hooks]]
address = 0x0069a3e0
type = "detour"
function = "OverrideSetAnimationInternalId"
original_bytes = [0x6a, 0xff, 0x64, 0xa1, 0x00, 0x00, 0x00, 0x00]

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # CSWCAnimBaseWield::SetAnimationInternal animation-id stack slot.

# CSWCAnimBaseTW::SetAnimationInternal entry.
#
# This is the body/torso path that ultimately falls back to
# CSWCAnimBase::SetAnimationInternal. It is the key visual gate for PMBAM.
[[hooks]]
address = 0x0069c940
type = "detour"
function = "OverrideSetAnimationInternalId"
original_bytes = [0x64, 0xa1, 0x00, 0x00, 0x00, 0x00]

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # CSWCAnimBaseTW::SetAnimationInternal animation-id stack slot.

# These first hooks target the shared fallback epilogues in the client-side
# attack animation ID resolvers. They let vanilla compute an animation ID, then
# allow CustomAnimationCore to swap ESI and emulate the original function
# epilogue. They are intentionally non-returning because the stolen bytes
# include RET instructions that must execute against Update*AttackData's stack
# frame, not inside KPM's generated wrapper.

# CSWCCreature::UpdateMeleeAttackData fallback/default epilogue.
[[hooks]]
address = 0x0061406c
type = "detour"
function = "OverrideMeleeDefaultAnimationId"
original_bytes = [0x5f, 0x8b, 0xc6, 0x5e, 0x5b, 0xc2, 0x10, 0x00]
exclude_from_restore = ["esi"]
skip_original_bytes = true

[[hooks.parameters]]
source = "esi"
type = "uint" # Vanilla animation id.

[[hooks.parameters]]
source = "esp+16"
type = "pointer" # UpdateMeleeAttackData param_1.

[[hooks.parameters]]
source = "esp+28"
type = "pointer" # UpdateMeleeAttackData param_4.

# CSWCCreature::UpdateRangedAttackData fallback/default epilogue.
[[hooks]]
address = 0x0061428c
type = "detour"
function = "OverrideRangedDefaultAnimationId"
original_bytes = [0x8b, 0xc6, 0x5e, 0xc2, 0x08, 0x00]
exclude_from_restore = ["esi"]
skip_original_bytes = true

[[hooks.parameters]]
source = "esi"
type = "uint" # Vanilla animation id.

[[hooks.parameters]]
source = "esp+8"
type = "pointer" # UpdateRangedAttackData param_1.

[[hooks.parameters]]
source = "esp+12"
type = "pointer" # UpdateRangedAttackData param_2.

# CSWCAnimBase::GetAnimationName post-animations.2da lookup branch.
#
# This detour is intentionally non-returning. The stolen bytes include a short
# conditional jump, so replaying them from the generated wrapper would retarget
# the branch into wrapper memory. OverrideAnimationNameLookup restores the
# wrapper-saved CPU state itself, then jumps to either:
# - 0x0069e6a2: vanilla success path, after output CExoString is populated
# - 0x0069e699: vanilla failure assignment path, after recreating the stolen PUSH
[[hooks]]
address = 0x0069e690
type = "detour"
function = "OverrideAnimationNameLookup"
original_bytes = [0x85, 0xc0, 0x75, 0x0e, 0x68, 0x1c, 0xd7, 0x73, 0x00]
skip_original_bytes = true
